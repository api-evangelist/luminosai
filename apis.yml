name: Luminos.AI
description: >-
  Luminos.AI is an AI governance and evaluation platform that tests AI systems —
  classical machine learning, generative AI, and autonomous agents — for legal,
  regulatory, and reputational risk. The platform automates continuous
  evaluations against customizable risks, generates privileged, audit-ready
  compliance documentation, runs approval and governance workflows, and monitors
  deployed models in real time for drift, updates, and deployment-context
  changes, all without requiring direct access to the underlying model. Luminos.AI
  was surfaced as a portfolio company of Bloomberg Beta and profiled into the API
  Evangelist network. It does not currently publish a public developer API, SDKs,
  or an OpenAPI definition; the product is engaged through hosted evaluations and
  demos.
